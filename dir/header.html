<style>
/* The container for the dropdown */
.dropdown {
    position: relative;
    display: inline-block;
}

/* Style the user profile icon button */
.user-btn {
    font-size: 24px;
    color: #4070f4;
    cursor: pointer;
    transition: color 0.3s ease;
}

/* Change color on hover */
.user-btn:hover {
    color: #265df2;
}

/* Style the dropdown content (hidden by default) */
.dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: #fff;
    box-shadow: 0 8px 16px rgba(255, 255, 255, 0.2);
    min-width: 160px;
    z-index: 1;
    border-radius: 5px;
    padding: 10px 0;
}

/* Style each item in the dropdown */
.dropdown-content a {
    color: #fff;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

/* Change background on hover */
.dropdown-content a:hover {
    background-color: #f1f1f1;
}
.dropdown-content icon {
    color: #fff;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

/* Change background on hover */
.dropdown-content icon:hover {
    background-color: #f1f1f1;
}

/* Show the dropdown content when hovering over the button */
.dropdown:hover .dropdown-content {
    display: block;
}





/* Dropdown content (hidden by default) */

  display: none;

  background-color: #f1f1f1;

}

/* Show the dropdown menu when hovering the button */
.dropdown:hover .dropdown-content {

}

</style>
