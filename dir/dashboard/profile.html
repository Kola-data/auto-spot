{% extends "dashboard/base.html" %}
{% block title %}Dashboard-Car{% endblock %}

{% block content %}
{% include "dashboard/aside-header.html" %}



<main role="main" class="main-content">
    
    <div class="container-fluid">
        {% if data %}
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
          <h2 class="h3 mb-4 page-title">My Profile</h2>
          <div class="my-4">
            <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
              <li class="nav-item">
                <a class="nav-link active" id="home-tab" data-toggle="tab" href="" role="tab" aria-controls="home" aria-selected="true">Profile</a>
              </li>
              
            </ul>
            <form>
              <div class="row mt-5 align-items-center">
                <div class="col-md-3 text-center mb-5">
                  <div class="avatar avatar-xl">
                    <i class="fe fe-user fe-16" style="font-size: 50px;"></i>
                    
                  </div>
                </div>
                <div class="col">
                  <div class="row align-items-center">
                    <div class="col-md-7">
                      <h4 class="mb-1">{{data[0].names}}</h4>
                      <p class="small mb-3"><span class="badge badge-dark">{{data[0].utype}}</span></p>
                    </div>
                  </div>
                  
                  </div>
                </div>
              </div>
              <hr class="my-4">
              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="firstname">Nation Id</label>
                  <input type="text" id="firstname" class="form-control" value="{{data[0].nid}}" readonly>
                </div>
                <div class="form-group col-md-6">
                  <label for="lastname">Phone Number</label>
                  <input type="text" id="lastname" class="form-control" value="{{data[0].phone}}" readonly>
                </div>
              </div>
              <div class="form-group">
                <label for="inputEmail4">Username</label>
                <input type="email" class="form-control" id="inputEmail4" value="{{data[0].username}}" readonly>
              </div>
              <div class="form-group">
                <label for="inputAddress5">Password</label>
                <input type="text" class="form-control" id="inputAddress5" value="{{data[0].password}}">
              </div>
              
              <hr class="my-4">
              
              <button type="submit" class="btn mb-2 btn-outline-success" style="height:40px;">Save Change</button>
            </form>
          </div> <!-- /.card-body -->
        </div> <!-- /.col-12 -->
      </div> <!-- .row -->
    
    {% else %}
    <p>No profile data available.</p>
    {% endif %}
</div> <!-- .container-fluid -->
    
    
  </main> <!-- main -->


  
</div> <!-- .wrapper -->
<script src="{{ url_for('static', filename='js/jquery.min.js')}}"></script>
<script src="{{ url_for('static', filename='js/popper.min.js')}}"></script>
<script src="{{ url_for('static', filename='js/moment.min.js')}}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js')}}"></script>
<script src="{{ url_for('static', filename='js/simplebar.min.js')}}"></script>
<script src="{{ url_for('static', filename='js/daterangepicker.js')}}"></script>
<script src="{{ url_for('static', filename='js/jquery.stickOnScroll.js')}}"></script>
<script src="{{ url_for('static', filename='js/tinycolor-min.js')}}"></script>
<script src="{{ url_for('static', filename='js/config.js')}}"></script>
<script src="{{ url_for('static', filename='js/apps.js')}}"></script>

{% endblock %}
